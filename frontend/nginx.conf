server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api to the backend if we don't want to bake VITE_API_BASE_URL at build time
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    # }
}
